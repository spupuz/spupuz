<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Alessandro, aka spupuz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="1" r="0.75">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="avatarClip"><circle cx="150" cy="150" r="84"/></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow1)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <g transform="translate(920,55)" opacity="0.13" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round">
    <path d="M0 105 Q110 8 220 105 Q110 202 0 105 Z"/>
    <circle cx="110" cy="105" r="48"/>
    <circle cx="110" cy="105" r="16" fill="url(#accent)" stroke="none"/>
  </g>

  <circle cx="150" cy="150" r="90" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="150" cy="150" r="84" fill="#0B1220"/>
  <image href="data:image/png;base64,__AVATAR__" x="66" y="66" width="168" height="168" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <text x="280" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Alessandro</text>
  <text x="282" y="164" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#22D3EE">spupuz · vibe coder &amp; self-hoster</text>
  <text x="282" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94A3B8">I turn weekend-long setups into one-command installs.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">
    <rect x="282" y="232" rx="14" width="174" height="28" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="301" y="251">VibeNVR maintainer</text>
    <rect x="468" y="232" rx="14" width="122" height="28" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="487" y="251">Self-hosted</text>
    <rect x="602" y="232" rx="14" width="78" height="28" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="621" y="251">Italy</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
