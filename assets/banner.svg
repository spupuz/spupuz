<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="spupuz profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.6" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.1" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="1" r="0.8">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="avatarClip"><circle cx="140" cy="140" r="78"/></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow1)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <g transform="translate(900,45)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" opacity="0.14">
    <path d="M0 96 Q100 6 200 96 Q100 186 0 96 Z"/>
    <circle cx="100" cy="96" r="44"/>
    <circle cx="100" cy="96" r="14" fill="url(#accent)"/>
  </g>

  <circle cx="140" cy="140" r="84" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="140" cy="140" r="78" fill="#0B1220"/>
  <image href="https://raw.githubusercontent.com/spupuz/spupuz/main/assets/avatar.png" x="62" y="62" width="156" height="156" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <text x="290" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Alessandro</text>
  <text x="292" y="166" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#22D3EE">spupuz · self-hoster &amp; vibe coder</text>
  <text x="292" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94A3B8">Turn weekend-long setups into one-command installs.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">
    <rect x="292" y="234" rx="13" width="160" height="28" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="311" y="253">VibeNVR maintainer</text>
    <rect x="464" y="234" rx="13" width="108" height="28" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="483" y="253">Self-hosted</text>
    <rect x="584" y="234" rx="13" width="70" height="28" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="603" y="253">Italy</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
